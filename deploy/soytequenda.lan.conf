# Sitio estático "Mi Región del Tequendama" — build Astro en dist/
# Ver: scripts/setup-domain.sh
<VirtualHost *:80>
    ServerName soytequenda.lan
    ServerAlias soytequendama.lan

    DocumentRoot /var/www/soytequendama.lan/dist

    <Directory /var/www/soytequendama.lan/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorLog /var/log/apache2/soytequenda.lan_error.log
    CustomLog /var/log/apache2/soytequenda.lan_access.log combined

    # API PHP (Medoo) en /api — enruta todo a api/index.php
    Alias /api /var/www/soytequendama.lan/api
    <Directory /var/www/soytequendama.lan/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        FallbackResource /api/index.php
    </Directory>
</VirtualHost>